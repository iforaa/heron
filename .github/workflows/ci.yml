name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # ffmpeg keeps the real video-render test live; potrace the outline test.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg potrace
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The published CLI must answer from dist/: shebang, .js extensions, runtime deps.
      - run: node dist/cli.js --help
      - run: pnpm examples
